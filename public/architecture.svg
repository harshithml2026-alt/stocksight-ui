<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 535" font-family="Inter, system-ui, sans-serif" style="background:#0f0f0f">

  <!-- Title -->
  <text x="40" y="36" font-size="19" font-weight="700" fill="#ffffff">StockSight Architecture</text>
  <text x="40" y="54" font-size="11" fill="#555555">Angular 19 · FastAPI · LlamaIndex · OpenAI · Pinecone · MongoDB</text>

  <!-- ── COL 1: Frontend (x=30, w=175) ── -->

  <rect x="30" y="90" width="175" height="65" rx="12" fill="#1e3a5f" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="117" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#e0f0ff">Angular 19 UI</text>
  <text x="117" y="137" text-anchor="middle" font-size="11" fill="#7bb8f0">Hosted on Vercel</text>

  <rect x="30" y="220" width="175" height="60" rx="12" fill="#1a2f4a" stroke="#4a9eff" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="117" y="246" text-anchor="middle" font-size="12" font-weight="600" fill="#a0c8f0">SessionService</text>
  <text x="117" y="263" text-anchor="middle" font-size="11" fill="#6699bb">HttpClient layer</text>

  <line x1="117" y1="155" x2="117" y2="218" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ── COL 2: Backend (x=255, w=175) ── -->

  <rect x="255" y="90" width="175" height="65" rx="12" fill="#1e4a2f" stroke="#4aff88" stroke-width="1.5"/>
  <text x="342" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#d0ffe0">FastAPI Backend</text>
  <text x="342" y="137" text-anchor="middle" font-size="11" fill="#7bd4a0">Hosted on Render</text>

  <rect x="255" y="350" width="175" height="65" rx="12" fill="#2a2a1e" stroke="#ffdd4a" stroke-width="1.5"/>
  <text x="342" y="379" text-anchor="middle" font-size="13" font-weight="600" fill="#fff0a0">Session DB</text>
  <text x="342" y="397" text-anchor="middle" font-size="11" fill="#ccbb60">Hosted on MongoDB</text>

  <!-- FastAPI → Session DB (clean vertical) -->
  <line x1="342" y1="155" x2="342" y2="348" stroke="#ffdd4a" stroke-width="1.5" marker-end="url(#arr-yellow)"/>
  <text x="358" y="258" font-size="9.5" fill="#ccbb50">persist sessions</text>

  <!-- SessionService → FastAPI -->
  <line x1="205" y1="247" x2="253" y2="145" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="220" y="210" text-anchor="middle" font-size="9" fill="#88ccff">POST /chat/message</text>
  <text x="220" y="222" text-anchor="middle" font-size="9" fill="#88ccff">GET /chat/sessions</text>

  <!-- ── COL 2.5: Orchestration (x=450, w=155) ends at x=605 ── -->

  <rect x="450" y="205" width="155" height="60" rx="10" fill="#0e2218" stroke="#4aff88" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="527" y="231" text-anchor="middle" font-size="12" font-weight="600" fill="#a0ffcc">LlamaIndex</text>
  <text x="527" y="249" text-anchor="middle" font-size="10" fill="#5aaa80">Orchestration layer</text>

  <!-- FastAPI → LlamaIndex (internal dashed) -->
  <line x1="430" y1="140" x2="453" y2="220" stroke="#4aff88" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- ── COL 3: AI / Data (x=700, w=175) gap from LlamaIndex = 95px ── -->

  <rect x="700" y="60" width="175" height="65" rx="12" fill="#2a1e1e" stroke="#ff6060" stroke-width="1.5"/>
  <text x="787" y="89" text-anchor="middle" font-size="13" font-weight="600" fill="#ffd0d0">SEC EDGAR</text>
  <text x="787" y="107" text-anchor="middle" font-size="11" fill="#cc8080">10-K · 10-Q · 8-K</text>

  <rect x="700" y="185" width="175" height="65" rx="12" fill="#3a2a1e" stroke="#ffa04a" stroke-width="1.5"/>
  <text x="787" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#ffe0c0">VectorDB</text>
  <text x="787" y="232" text-anchor="middle" font-size="11" fill="#cc9060">Hosted on Pinecone</text>

  <rect x="700" y="315" width="175" height="65" rx="12" fill="#2a1e3a" stroke="#c04aff" stroke-width="1.5"/>
  <text x="787" y="344" text-anchor="middle" font-size="13" font-weight="600" fill="#f0d0ff">LLM</text>
  <text x="787" y="362" text-anchor="middle" font-size="11" fill="#9960cc">OpenAI GPT</text>

  <!-- SEC EDGAR → VectorDB -->
  <line x1="787" y1="125" x2="787" y2="183" stroke="#ff6060" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="803" y="158" font-size="9.5" fill="#ff8888">indexed filings</text>

  <!-- LlamaIndex → VectorDB (semantic search, upper lane) -->
  <line x1="606" y1="222" x2="698" y2="205" stroke="#ffa04a" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="652" y="198" text-anchor="middle" font-size="10" font-weight="600" fill="#ffbb70">semantic search</text>

  <!-- VectorDB → LlamaIndex (context chunks, lower lane) -->
  <line x1="700" y1="228" x2="608" y2="245" stroke="#ffa04a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <text x="652" y="258" text-anchor="middle" font-size="10" font-weight="600" fill="#ffbb70">context chunks</text>

  <!-- LlamaIndex → LLM (grounded prompt) -->
  <line x1="606" y1="252" x2="698" y2="335" stroke="#c04aff" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="660" y="310" text-anchor="middle" font-size="9.5" fill="#cc80ff">grounded prompt</text>

  <!-- ── Legend ── -->
  <rect x="30" y="452" width="855" height="58" rx="10" fill="#ffffff08" stroke="#ffffff15" stroke-width="1"/>
  <text x="50" y="474" font-size="10" fill="#888">Legend:</text>
  <rect x="105" y="463" width="12" height="12" rx="3" fill="#1e3a5f" stroke="#4a9eff" stroke-width="1"/>
  <text x="123" y="474" font-size="10" fill="#aaa">Frontend</text>
  <rect x="195" y="463" width="12" height="12" rx="3" fill="#1e4a2f" stroke="#4aff88" stroke-width="1"/>
  <text x="213" y="474" font-size="10" fill="#aaa">Backend</text>
  <rect x="280" y="463" width="12" height="12" rx="3" fill="#3a2a1e" stroke="#ffa04a" stroke-width="1"/>
  <text x="298" y="474" font-size="10" fill="#aaa">Vector DB</text>
  <rect x="370" y="463" width="12" height="12" rx="3" fill="#2a1e3a" stroke="#c04aff" stroke-width="1"/>
  <text x="388" y="474" font-size="10" fill="#aaa">LLM</text>
  <rect x="430" y="463" width="12" height="12" rx="3" fill="#2a1e1e" stroke="#ff6060" stroke-width="1"/>
  <text x="448" y="474" font-size="10" fill="#aaa">Data Ingestion</text>
  <rect x="545" y="463" width="12" height="12" rx="3" fill="#2a2a1e" stroke="#ffdd4a" stroke-width="1"/>
  <text x="563" y="474" font-size="10" fill="#aaa">Database</text>
  <line x1="50" y1="496" x2="80" y2="496" stroke="#888" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="88" y="500" font-size="10" fill="#aaa">Internal link</text>
  <line x1="185" y1="496" x2="215" y2="496" stroke="#888" stroke-width="1.5"/>
  <text x="223" y="500" font-size="10" fill="#aaa">Data / API flow</text>

  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a9eff"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4aff88"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ffa04a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c04aff"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ff6060"/>
    </marker>
    <marker id="arr-yellow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ffdd4a"/>
    </marker>
  </defs>

</svg>
