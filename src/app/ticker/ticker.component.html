<div class="w-full overflow-hidden border-b border-white/5 bg-black/30 py-3">
  <div class="ticker-track flex gap-12 w-max">
    <!-- First set -->
    <div *ngFor="let s of stocks" class="shrink-0 flex items-center justify-center h-12">
      <img
        [src]="s.logo"
        [alt]="s.name"
        [class]="s.size + ' object-contain logo-white'"
        (error)="$any($event.target).style.display='none'"
      />
    </div>
    <!-- Duplicate for seamless loop -->
    <div *ngFor="let s of stocks" class="shrink-0 flex items-center justify-center h-12">
      <img
        [src]="s.logo"
        [alt]="s.name"
        [class]="s.size + ' object-contain logo-white'"
        (error)="$any($event.target).style.display='none'"
      />
    </div>
  </div>
</div>
