<div class="w-full overflow-hidden border-b border-white/5 bg-black/30 py-3">
  <div class="ticker-track flex gap-12 items-center">
    <div *ngFor="let s of stocks" class="shrink-0 flex items-center justify-center" style="width: 64px; height: 32px;">
      <img
        [src]="s.logo"
        [alt]="s.name"
        class="logo-white"
        style="width: 100%; height: 100%; object-fit: contain; object-position: center; display: block;"
        [style.transform]="'scale(' + (s.scale / 100) + ') translateY(' + s.nudgeY + 'px)'"
        (error)="$any($event.target).style.display='none'"
      />
    </div>
    <!-- Duplicate for seamless loop on small screens -->
    <div *ngFor="let s of stocks" class="shrink-0 flex items-center justify-center ticker-duplicate" style="width: 64px; height: 32px;">
      <img
        [src]="s.logo"
        [alt]="s.name"
        class="logo-white"
        style="width: 100%; height: 100%; object-fit: contain; object-position: center; display: block;"
        [style.transform]="'scale(' + (s.scale / 100) + ') translateY(' + s.nudgeY + 'px)'"
        (error)="$any($event.target).style.display='none'"
      />
    </div>
  </div>
</div>
