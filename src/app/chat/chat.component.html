<!-- Navbar -->
<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-6 py-4 bg-black/60 backdrop-blur-md border-b border-white/10">
  <div class="flex items-center gap-3">
    <button (click)="sidebarOpen = !sidebarOpen" class="text-gray-400 hover:text-white transition-colors p-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <button (click)="goHome()" class="text-white text-xl font-bold tracking-wide hover:text-blue-400 transition-colors">
      StockSight
    </button>
  </div>
  <span class="text-xs text-gray-500 font-mono hidden sm:block">{{ sessionId }}</span>
</header>

<!-- Mobile sidebar backdrop -->
<div
  *ngIf="sidebarOpen"
  class="fixed inset-0 z-30 bg-black/60 md:hidden"
  (click)="sidebarOpen = false"
></div>

<!-- Sidebar -->
<aside
  class="sidebar fixed top-[65px] left-0 bottom-0 z-40 w-64 bg-gray-950/95 border-r border-white/10 flex flex-col transition-transform duration-300"
  [class.sidebar-hidden]="!sidebarOpen"
>
  <div class="flex items-center justify-between px-4 py-3 border-b border-white/10">
    <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Recent Sessions</span>
    <button (click)="goHome()"
      class="flex items-center gap-1 text-xs text-blue-400 hover:text-blue-300 transition-colors">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12l7-7 7 7"/>
      </svg>
      New
    </button>
  </div>

  <div class="flex-1 overflow-y-auto py-2">
    <ng-container *ngIf="sessions.length > 0; else empty">
      <div
        *ngFor="let s of sessions"
        (click)="openSession(s.id)"
        class="group relative flex items-start justify-between gap-2 px-4 py-3 cursor-pointer hover:bg-white/5 transition-colors border-l-2"
        [class.border-blue-500]="s.id === sessionId"
        [class.border-transparent]="s.id !== sessionId"
      >
        <div class="flex-1 min-w-0">
          <p class="text-sm text-gray-300 truncate" [class.text-white]="s.id === sessionId">
            {{ s.preview }}
          </p>
          <p class="text-xs text-gray-600 mt-0.5">
            {{ s.createdAt | date:'MMM d, h:mm a' }}
          </p>
        </div>

        <!-- 3-dot menu button -->
        <button
          (click)="toggleMenu($event, s.id)"
          class="text-gray-600 hover:text-white transition-all shrink-0 mt-0.5 p-0.5 rounded menu-btn"
          [class.text-white]="activeMenu === s.id"
        >
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>
          </svg>
        </button>

        <!-- Dropdown menu -->
        <div
          *ngIf="activeMenu === s.id"
          class="absolute right-2 top-8 z-50 w-36 bg-gray-900 border border-white/10 rounded-xl shadow-xl overflow-hidden"
          (click)="$event.stopPropagation()"
        >
          <button
            (click)="archiveSession($event, s.id)"
            class="w-full flex items-center gap-2 px-4 py-2.5 text-sm text-gray-300 hover:bg-white/5 hover:text-white transition-colors"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/>
            </svg>
            Archive
          </button>
          <button
            (click)="deleteSession($event, s.id)"
            class="w-full flex items-center gap-2 px-4 py-2.5 text-sm text-red-400 hover:bg-white/5 hover:text-red-300 transition-colors"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
            </svg>
            Delete
          </button>
        </div>
      </div>
    </ng-container>
    <ng-template #empty>
      <p class="text-xs text-gray-600 text-center mt-8 px-4">No previous sessions</p>
    </ng-template>
  </div>
</aside>

<!-- Chat scroll area — fixed container between navbar and input bar -->
<main
  class="chat-scroll fixed top-[65px] left-0 right-0 overflow-y-auto overflow-x-hidden bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 transition-all duration-300"
  [style.bottom.px]="inputBarHeight"
  [class.sidebar-push]="sidebarOpen"
  (click)="closeMenu()"
>
  <div class="w-full max-w-3xl mx-auto px-4 pt-6 pb-4 flex flex-col gap-5">

    <ng-container *ngFor="let msg of messages">
      <!-- User message -->
      <div *ngIf="msg.role === 'user'" class="flex justify-end">
        <div class="max-w-[85%] bg-blue-600 text-white text-sm px-4 py-3 rounded-2xl rounded-tr-sm shadow-lg break-words">
          {{ msg.text }}
        </div>
      </div>

      <!-- AI message -->
      <div *ngIf="msg.role === 'ai'" class="flex justify-start gap-3 items-start">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-cyan-500 flex items-center justify-center shrink-0 text-white text-xs font-bold">
          S
        </div>
        <div class="flex-1 min-w-0 flex flex-col gap-1.5">
          <div class="bg-white/5 border border-white/10 text-gray-200 text-sm px-4 py-3 rounded-2xl rounded-tl-sm shadow-lg prose prose-invert prose-sm max-w-none">
            <markdown [data]="msg.text" />
          </div>
          <!-- SEC Sources -->
          <div *ngIf="msg.sources && msg.sources.length > 0"
            class="bg-white/[0.04] border border-white/[0.07] rounded-xl px-3 py-2 flex items-center gap-2 overflow-hidden">
            <span class="text-[10px] text-white/30 uppercase tracking-widest font-medium shrink-0">Sources</span>
            <span class="text-[11px] text-white/40 font-mono truncate">{{ formatSources(msg.sources) }}</span>
          </div>
          <!-- Metrics -->
          <div *ngIf="msg.metrics" class="flex items-center gap-2 px-1 text-[11px] text-white/40 font-mono select-none">
            <span>{{ msg.metrics.total_tokens }} tokens</span>
            <span>·</span>
            <span>{{ msg.metrics.inference_time_sec }}s</span>
            <span>·</span>
            <span>{{ msg.metrics.tokens_per_sec }} tok/s</span>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- Typing indicator -->
    <div *ngIf="isTyping" class="flex justify-start gap-3 items-start">
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-cyan-500 flex items-center justify-center shrink-0 text-white text-xs font-bold">
        S
      </div>
      <div class="bg-white/5 border border-white/10 px-5 py-3 rounded-2xl rounded-tl-sm">
        <div class="typing-dots flex gap-1 items-center h-4">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div #messagesEnd></div>
  </div>
</main>

<!-- Input bar -->
<div #inputBar class="fixed bottom-0 left-0 right-0 z-50 bg-gray-950/90 backdrop-blur-md border-t border-white/10 px-4 py-4 transition-all duration-300"
  [class.input-push]="sidebarOpen">
  <div class="max-w-3xl mx-auto flex items-end gap-3 bg-white/5 border border-white/15 rounded-2xl px-5 py-3 focus-within:border-blue-500 transition-colors">
    <textarea
      #textarea
      rows="1"
      placeholder="Ask a follow-up question..."
      class="flex-1 bg-transparent text-white placeholder-gray-500 text-sm outline-none resize-none leading-relaxed overflow-y-auto"
      style="max-height: 160px;"
      [(ngModel)]="input"
      (input)="autoResize()"
      (keydown)="onKeydown($event)"
    ></textarea>
    <button
      class="shrink-0 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-medium px-5 py-2 rounded-xl transition-colors"
      (click)="send()"
      [disabled]="isTyping || !input.trim()"
    >
      Ask
    </button>
  </div>
</div>
